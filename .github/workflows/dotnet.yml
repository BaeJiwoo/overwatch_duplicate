name: Shared and server checks
on:
  push:
    branches: ['main', 'issue-*']
  pull_request:
permissions:
  contents: read
jobs:
  phase1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build FPSPrototype.slnx -c Release
      - run: dotnet run --project Tests/FPSPrototype.Tests.csproj -c Release --no-build
      - run: dotnet run --project Server/FPSPrototype.Server.csproj -c Release --no-build -- --validate-map
# Unity Editor/Play Mode requires a separately licensed machine; this workflow does not claim to run it.
